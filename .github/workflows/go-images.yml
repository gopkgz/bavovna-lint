name: Go images

on:
  pull_request:
    branches: [main]
    paths:
      - 'images/ci-go-*/**'
      - 'scripts/check-go-image-contract.sh'
      - '.github/workflows/go-images.yml'
  push:
    branches: [main]
    paths:
      - 'images/ci-go-*/**'
      - 'scripts/check-go-image-contract.sh'
      - '.github/workflows/go-images.yml'
  workflow_dispatch:

concurrency:
  group: go-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: 1.27.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ci-go-nocgo
            cgo: '0'
          - image: ci-go-cgo
            cgo: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Build and verify
        env:
          LOCAL_IMAGE: local/${{ matrix.image }}:${{ github.sha }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$LOCAL_IMAGE" \
            "images/${{ matrix.image }}"
          scripts/check-go-image-contract.sh "$LOCAL_IMAGE" "${{ matrix.cgo }}"

      - name: Publish immutable tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: publish
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
        run: |
          registry_image="ghcr.io/gopkgz/bavovna-lint-${IMAGE}"
          version_ref="${registry_image}:${GO_VERSION}-alpine"
          source_ref="${registry_image}:sha-${GITHUB_SHA}"
          local_image="local/${IMAGE}:${GITHUB_SHA}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$local_image" "$version_ref"
          docker tag "$local_image" "$source_ref"
          docker push "$version_ref"
          docker push "$source_ref"
          digest=$(docker buildx imagetools inspect "$source_ref" --format '{{json .Manifest}}' | jq -r .digest)
          test "$digest" != null
          echo "reference=${source_ref}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify anonymous immutable pull
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REFERENCE: ${{ steps.publish.outputs.reference }}
        run: |
          docker logout ghcr.io
          docker image rm "local/${{ matrix.image }}:${GITHUB_SHA}" \
            "ghcr.io/gopkgz/bavovna-lint-${{ matrix.image }}:${GO_VERSION}-alpine" \
            "ghcr.io/gopkgz/bavovna-lint-${{ matrix.image }}:sha-${GITHUB_SHA}"
          docker pull "$REFERENCE"
          scripts/check-go-image-contract.sh "$REFERENCE" "${{ matrix.cgo }}"
